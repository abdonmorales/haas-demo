server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

spring:
  application:
    name: haas-demo
  profiles:
    default: dev            # embedded MongoDB; use SPRING_PROFILES_ACTIVE=prod for a real cluster
  jackson:
    deserialization:
      accept-float-as-int: false   # reject 2.5 instead of silently truncating it to 2

haas:
  # Two separate MongoDB databases on the same server, so account data and inventory data
  # can be scaled, backed up and secured independently:
  #   users    -> user accounts + projects
  #   hardware -> hardware sets + per-project checkouts
  mongo:
    users-database: ${USERS_DB_NAME:haas_users}
    hardware-database: ${HARDWARE_DB_NAME:haas_hardware}

  crypto:
    # 32-byte base64 master key used to encrypt user IDs (AES-GCM) and derive the
    # user-ID lookup HMAC. DEMO DEFAULT ONLY - set HAAS_CRYPTO_KEY in any real deploy.
    master-key: ${HAAS_CRYPTO_KEY:ZGVtby1vbmx5LWtleS1jaGFuZ2UtbWUtMzItYnl0ZXM=}

  demo:
    user-chooser: true       # populates the "User choose" dropdown on the login page

  # Simulated data, loaded only when the corresponding database is empty.
  seed:
    demo-password: "Demo#2026!"
    users: [ada, grace, linus]
    projects:
      - project-id: AMPLAB1
        name: Audio Amplifier Build
        description: Designs and characterizes a Class-AB audio amplifier.
        members: [ada, grace]
      - project-id: SENSOR7
        name: Sensor Calibration Rig
        description: Calibrates temperature and strain sensors against reference instruments.
        members: [linus]
    hardware:
      - name: Oscilloscopes
        description: 4-channel 200 MHz digital oscilloscopes
        capacity: 60
      - name: Function-Generators
        description: Dual-channel arbitrary function generators
        capacity: 40
      - name: Power-Supplies
        description: Triple-output programmable bench power supplies
        capacity: 30
    checkouts:
      - project-id: AMPLAB1
        hw-set: Oscilloscopes
        quantity: 12
      - project-id: SENSOR7
        hw-set: Function-Generators
        quantity: 8

# Embedded MongoDB (Flapdoodle) version, used by the dev and test profiles.
de.flapdoodle.mongodb.embedded.version: 7.0.14
